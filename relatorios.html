
<!DOCTYPE html>
<!--
  SAIC - Relatorios gerenciais
  Arquivo organizado para manutencao visual e funcional no Apps Script.
  Mantem filtros, abas, busca individual e chamadas ao codigo.gs.
-->
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /*
      CSS principal
      - Variaveis visuais
      - Layout institucional
      - Filtros, indicadores e abas
      - Tabelas, rankings e busca individual
      - Responsividade
    */
    :root {
      --bg: #f4f8fb;
      --surface: #ffffff;
      --surface-soft: #f8fbfd;
      --line: #d8e2ea;
      --line-soft: #edf3f7;
      --text: #334155;
      --muted: #64748b;
      --primary: #3b82a0;
      --primary-dark: #2f6f89;
      --primary-soft: #7fb6cc;
      --sidebar: #6f97ad;
      --sidebar-soft: #7fb6cc;
      --success: #6ca88d;
      --success-soft: #e8f5ee;
      --warning: #a16207;
      --warning-soft: #fff7df;
      --danger: #b42318;
      --danger-soft: #fff1f0;
      --purple: #6f97ad;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin: 60px auto;
      max-width: 480px;
      padding: 28px;
      text-align: center;
    }

    .login-box h2 {
      color: var(--primary);
      margin: 0 0 10px;
    }

    .login-box p {
      color: var(--muted);
      margin: 0 0 18px;
    }

    #conteudoRelatorios {
      min-height: 100vh;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-soft) 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 28px;
      min-height: 100vh;
      padding: 26px 20px;
      position: sticky;
      top: 0;
    }

    .brand {
      align-items: center;
      display: flex;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      align-items: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 8px;
      display: flex;
      font-size: 20px;
      font-weight: 900;
      height: 46px;
      justify-content: center;
      width: 46px;
    }

    .brand-title {
      display: block;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: rgba(255, 255, 255, 0.72);
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
    }

    .side-nav {
      display: grid;
      gap: 8px;
    }

    .side-nav a {
      align-items: center;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.82);
      display: flex;
      font-size: 14px;
      font-weight: 800;
      gap: 10px;
      min-height: 42px;
      padding: 10px 12px;
      text-decoration: none;
    }

    .side-nav a:hover,
    .side-nav a.active {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    .nav-dot {
      background: #eef4f7;
      border-radius: 999px;
      height: 8px;
      width: 8px;
    }

    .sidebar-footer {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      margin-top: auto;
      padding: 14px;
    }

    .sidebar-footer span {
      color: rgba(255, 255, 255, 0.68);
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .sidebar-footer strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
    }

    .reports-content {
      min-width: 0;
    }

    .topbar {
      align-items: center;
      background: transparent;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      padding: 30px 34px 18px;
    }

    .eyebrow {
      color: var(--success);
      display: block;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--primary);
      font-size: 28px;
      font-weight: 900;
      margin: 0 0 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    main {
      margin: 0 auto;
      max-width: 1440px;
      padding: 0 34px 34px;
    }

    .actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      min-height: 40px;
      padding: 10px 14px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .btn-primary {
      background: var(--primary-soft);
      box-shadow: 0 10px 22px rgba(127, 182, 204, 0.22);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--sidebar);
    }

    .btn-secondary {
      background: #e8eef3;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-light {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .filters-panel,
    .content-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .filters-panel {
      margin-bottom: 18px;
    }

    .section-title {
      align-items: baseline;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title h2 {
      color: var(--primary);
      font-size: 18px;
      font-weight: 900;
      margin: 0;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .filters-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .field label {
      color: #475569;
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    input,
    select {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      min-height: 40px;
      padding: 10px;
      width: 100%;
    }

    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .metrics-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      margin-bottom: 18px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 96px;
      overflow: hidden;
      padding: 16px;
      position: relative;
    }

    .metric::before {
      content: "";
      height: 100%;
      left: 0;
      position: absolute;
      top: 0;
      width: 5px;
    }

    .metric:nth-child(1)::before { background: var(--success); }
    .metric:nth-child(2)::before { background: var(--primary); }
    .metric:nth-child(3)::before { background: var(--warning); }
    .metric:nth-child(4)::before { background: var(--danger); }
    .metric:nth-child(5)::before { background: var(--primary); }
    .metric:nth-child(6)::before { background: var(--warning); }
    .metric:nth-child(7)::before { background: var(--danger); }

    .metric span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .metric strong {
      color: var(--success);
      display: block;
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
    }

    .metric:nth-child(2) strong { color: var(--primary); }
    .metric:nth-child(3) strong { color: var(--warning); }
    .metric:nth-child(4) strong { color: var(--danger); }
    .metric:nth-child(5) strong { color: var(--primary); }
    .metric:nth-child(6) strong { color: var(--warning); }
    .metric:nth-child(7) strong { color: var(--danger); }

    .tabs {
      background: #eef4f7;
      border-radius: 8px;
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      overflow-x: auto;
      padding: 6px;
    }

    .tab-button {
      background: transparent;
      border-radius: 8px;
      color: var(--muted);
      flex: 0 0 auto;
      min-height: 40px;
      padding: 9px 13px;
    }

    .tab-button.active {
      background: var(--surface);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      color: var(--primary-dark);
    }

    .tab-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .chart-box,
    .table-box {
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
    }

    .chart-box h3,
    .table-box h3 {
      color: var(--primary);
      font-size: 16px;
      font-weight: 900;
      margin: 0 0 14px;
    }

    .bar-row {
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(130px, 220px) 1fr 56px;
      margin-bottom: 10px;
      min-height: 26px;
    }

    .bar-label {
      color: var(--text);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-track {
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: 999px;
      height: 100%;
      min-width: 3px;
    }

    .bar-total {
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      text-align: right;
    }

    .empty-state {
      background: var(--warning-soft);
      border: 1px solid #fde68a;
      border-radius: 8px;
      color: var(--warning);
      padding: 14px;
    }

    .loading,
    .error {
      border-radius: 8px;
      font-weight: 800;
      padding: 16px;
    }

    .loading {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      color: var(--muted);
    }

    .error {
      background: var(--danger-soft);
      border: 1px solid #fecaca;
      color: var(--danger);
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border-bottom: 1px solid var(--line-soft);
      font-size: 13px;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #edf3f7;
      color: #475569;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .status-line {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      text-align: right;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .pill {
      background: var(--success-soft);
      border-radius: 999px;
      color: var(--success);
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
    }

    .individual-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .individual-card {
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      min-height: 88px;
      padding: 14px;
    }

    .individual-card span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .individual-card strong {
      color: var(--text);
      display: block;
      font-size: 18px;
      line-height: 1.25;
      word-break: break-word;
    }

    .individual-report {
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.75;
      padding: 18px;
    }

    .individual-report p {
      margin: 0 0 10px;
    }

    .individual-report p:last-child {
      margin-bottom: 0;
    }

    .individual-report strong {
      color: var(--title-dark);
      font-weight: 900;
    }

    .individual-observacoes {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .individual-observacao-item {
      background: #f8fafc;
      border: 1px solid var(--line-soft);
      border-left: 4px solid var(--success);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .individual-observacao-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .individual-observacao-texto {
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      margin: 6px 0 0;
      white-space: pre-wrap;
    }

    @media (max-width: 1180px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        position: static;
      }

      .side-nav {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .filters-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 22px 14px 16px;
      }

      main {
        padding: 0 14px 18px;
      }

      .sidebar {
        padding: 18px 14px;
      }

      .side-nav {
        grid-template-columns: 1fr 1fr;
      }

      .filters-grid,
      .tab-grid,
      .metrics-grid,
      .individual-grid {
        grid-template-columns: 1fr;
      }

      .actions,
      .filter-actions {
        justify-content: stretch;
        width: 100%;
      }

      .actions button,
      .filter-actions button {
        flex: 1 1 auto;
      }

      .bar-row {
        grid-template-columns: 1fr 54px;
      }

      .bar-track {
        grid-column: 1 / -1;
        height: 12px;
      }
    }

    @media print {
      .topbar,
      .sidebar,
      .filters-panel,
      .tabs,
      .actions,
      .filter-actions {
        display: none;
      }

      body {
        background: #ffffff;
      }

      .app-shell {
        display: block;
      }

      main {
        max-width: none;
        padding: 0;
      }

      .content-panel,
      .metric,
      .chart-box,
      .table-box {
        border-color: #cbd5e1;
        box-shadow: none;
      }
    }
  /* Design institucional alinhado ao Index aprovado */
:root {
  --bg: #f4f8fb;
  --surface: #ffffff;
  --surface-soft: #f8fbfd;
  --line: #d8e2ea;
  --line-soft: #edf3f7;
  --text: #334155;
  --muted: #64748b;
  --primary: #df0209;
  --primary-dark: #a90008;
  --primary-soft: #f4d6d7;
  --sidebar: #3f4141;
  --sidebar-soft: #2e3030;
  --success: #0f766e;
  --success-dark: #115e59;
  --shadow: 0 20px 46px rgba(41, 48, 51, 0.10);
}

body {
  background: linear-gradient(180deg, #f4f8fb 0%, #eaf2f6 100%);
}

.app-shell {
  background: transparent;
}

.sidebar {
  background: linear-gradient(180deg, #5f6668 0%, #50575a 52%, #454b4e 100%);
  border-right: 3px solid #df0209;
  box-shadow: 12px 0 28px rgba(41, 48, 51, 0.10);
}

.brand-mark.preview-brand-logo {
  background: #ffffff;
  border: 3px solid #df0209;
  border-radius: 999px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
  height: 66px;
  overflow: hidden;
  padding: 0;
  width: 66px;
}

.brand-mark.preview-brand-logo img {
  display: block;
  height: 100%;
  object-fit: cover;
  object-position: center;
  width: 100%;
}

.brand-title {
  color: #ffffff;
  letter-spacing: 0;
}

.brand-title strong,
.brand-title span {
  display: block;
}

.brand-title span {
  color: rgba(255, 255, 255, 0.72);
  font-size: 12px;
  font-weight: 700;
  margin-top: 4px;
}

.brand-subtitle {
  color: rgba(255, 255, 255, 0.72);
}

.side-nav a.active,
.side-nav .nav-item.active,
.side-nav .nav-item {
  background: rgba(255, 255, 255, 0.12);
  box-shadow: none;
}

.nav-dot {
  background: #ffffff;
}

.sidebar-footer {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.16);
}

.reports-content,
.dashboard-content,
.page-content {
  background:
    radial-gradient(circle at 88% 0%, rgba(127, 182, 204, 0.18), rgba(127, 182, 204, 0) 30%),
    #f4f8fb;
}

.topbar.preview-institutional-header {
  align-items: center;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,255,255,0.96), rgba(255,255,255,0) 50%),
    linear-gradient(180deg, #ffffff 0%, #f3f4f2 100%);
  border: 1px solid #d9dddc;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 18px 38px rgba(41, 48, 51, 0.10);
  display: grid;
  gap: 24px;
  grid-template-columns: minmax(260px, 1fr) auto;
  margin: 24px 34px 18px;
  min-height: 142px;
  overflow: visible;
  padding: 28px 34px;
  position: relative;
}

.topbar.preview-institutional-header::before,
.topbar.preview-institutional-header::after {
  content: "";
  pointer-events: none;
  position: absolute;
  z-index: 0;
}

.topbar.preview-institutional-header::before {
  background: linear-gradient(90deg, #df0209 0%, #df0209 62%, rgba(223, 2, 9, 0.72) 82%, rgba(223, 2, 9, 0) 100%);
  clip-path: polygon(0 0, 100% 0, 100% 20%, 0 100%);
  height: 11px;
  left: 0;
  top: 0;
  width: 100%;
}

.topbar.preview-institutional-header::after {
  background: linear-gradient(90deg, rgba(63, 65, 65, 0) 0%, rgba(63, 65, 65, 0.72) 20%, #3f4141 42%, #3f4141 100%);
  bottom: 0;
  clip-path: polygon(0 78%, 100% 0, 100% 100%, 0 100%);
  height: 11px;
  left: 0;
  width: 100%;
}

.preview-title-block,
.preview-logo-group,
.topbar.preview-institutional-header .actions {
  position: relative;
  z-index: 1;
}

.preview-title-block {
  border-left: 6px solid #df0209;
  padding-left: 18px;
}

.topbar.preview-institutional-header h1 {
  color: #293033;
  font-size: 32px;
  letter-spacing: 0;
}

.topbar.preview-institutional-header .subtitle,
.topbar.preview-institutional-header span {
  color: #626a6d;
  font-weight: 800;
}

.preview-logo-group {
  align-items: center;
  display: flex;
  gap: 14px;
}

.preview-logo-card {
  align-items: center;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  display: flex;
  height: 78px;
  justify-content: center;
  overflow: visible;
  padding: 0;
  width: 78px;
}

.preview-logo-card.logo-pm {
  width: 104px;
}

.preview-logo-card img {
  display: block;
  filter: contrast(1.08) saturate(1.06);
  height: 100%;
  image-rendering: auto;
  mix-blend-mode: multiply;
  object-fit: contain;
  width: 100%;
}

.preview-logo-card.logo-ssp img,
.preview-logo-card.logo-pm img {
  filter: contrast(1.12) saturate(1.08);
}

main,
.panel,
.filters-panel,
.tab-panel,
.card,
.metric-card,
.status-card,
.chart-card,
.ranking-card,
.map-card {
  border-color: #d8e2ea;
}

.panel,
.filters-panel,
.tab-panel,
.card,
.metric-card,
.status-card,
.chart-card,
.ranking-card {
  background: #ffffff;
}

input,
select,
textarea {
  background: #fcfdff;
  border-color: #d8e2ea;
  color: #334155;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #3b82a0;
  box-shadow: 0 0 0 3px rgba(59, 130, 160, 0.13);
  outline: none;
}

.section-title h2,
.section-head h2,
.panel h2 {
  color: #143f4c;
  display: flex;
  gap: 10px;
}

.section-title h2::before,
.section-head h2::before,
.panel h2::before {
  background: #df0209;
  border-radius: 999px;
  content: "";
  display: inline-block;
  flex: 0 0 auto;
  height: 18px;
  margin-top: 2px;
  width: 5px;

/* Cores dos titulos e graficos: vermelho somente como detalhe institucional */
:root {
  --title-dark: #293033;
  --chart-blue: #3b82a0;
  --chart-blue-soft: #7fb6cc;
  --chart-green: #6ca88d;
  --chart-green-dark: #4f9d69;
  --chart-amber: #a16207;
  --chart-slate: #64748b;
}

h1,
h2,
h3,
.section-title h2,
.section-head h2,
.panel h2,
.chart-box h3,
.ranking-box h3,
.table-box h3,
.chart-card h3,
.table-card h3,
.metric span {
  color: var(--title-dark) !important;
}

.eyebrow {
  color: var(--chart-green-dark) !important;
}

.metric:nth-child(1)::before { background: var(--chart-blue) !important; }
.metric:nth-child(1) strong { color: var(--chart-blue) !important; }
.metric:nth-child(2)::before { background: var(--chart-green-dark) !important; }
.metric:nth-child(2) strong { color: var(--chart-green-dark) !important; }
.metric:nth-child(3)::before { background: var(--chart-amber) !important; }
.metric:nth-child(3) strong { color: var(--chart-amber) !important; }
.metric:nth-child(4)::before { background: var(--chart-slate) !important; }
.metric:nth-child(4) strong { color: var(--chart-slate) !important; }
.metric:nth-child(5)::before { background: var(--chart-blue-soft) !important; }
.metric:nth-child(5) strong { color: var(--chart-blue-soft) !important; }
.metric:nth-child(6)::before { background: var(--chart-amber) !important; }
.metric:nth-child(6) strong { color: var(--chart-amber) !important; }
.metric:nth-child(7)::before { background: var(--chart-slate) !important; }
.metric:nth-child(7) strong { color: var(--chart-slate) !important; }

.bar-fill,
.ranking-fill {
  background: linear-gradient(90deg, var(--chart-blue), var(--chart-green)) !important;
}

.bar-row:nth-child(4n+1) .bar-fill,
.ranking-row:nth-child(4n+1) .ranking-fill {
  background: linear-gradient(90deg, #3b82a0, #7fb6cc) !important;
}

.bar-row:nth-child(4n+2) .bar-fill,
.ranking-row:nth-child(4n+2) .ranking-fill {
  background: linear-gradient(90deg, #4f9d69, #6ca88d) !important;
}

.bar-row:nth-child(4n+3) .bar-fill,
.ranking-row:nth-child(4n+3) .ranking-fill {
  background: linear-gradient(90deg, #64748b, #94a3b8) !important;
}

.bar-row:nth-child(4n+4) .bar-fill,
.ranking-row:nth-child(4n+4) .ranking-fill {
  background: linear-gradient(90deg, #a16207, #d6a94c) !important;
}

.tab-button.active {
  background: #293033 !important;
  color: #ffffff !important;
}

.btn-primary {
  background: #3b82a0 !important;
  box-shadow: 0 10px 22px rgba(59, 130, 160, 0.22) !important;
}

.btn-primary:hover {
  background: #2f6f89 !important;

        <button class="tab-button active" data-tab="resumo" onclick="trocarAba('resumo')">Resumo</button>
        <button class="tab-button" data-tab="atendimentos" onclick="trocarAba('atendimentos')">Demandas</button>
        <button class="tab-button" data-tab="perfil" onclick="trocarAba('perfil')">Perfil</button>
        <button class="tab-button" data-tab="localidade" onclick="trocarAba('localidade')">OPM / Localidade</button>
        <button class="tab-button" data-tab="vinculos" onclick="trocarAba('vinculos')">Vínculos</button>
        <button class="tab-button" data-tab="detalhado" onclick="trocarAba('detalhado')">Relatório Individual</button>
        <button class="tab-button" data-tab="outrosDados" onclick="trocarAba('outrosDados')">Outros Dados</button>
      </nav>

      <div id="conteudoAba"></div>
      <div id="rodapeResultado" class="status-line"></div>
    </section>
      </main>
    </div>
  </div>
</div>

  <script>
// Estado da tela: login, filtros, abas, carregamento e renderizacao do relatorio.
let tokenGoogle = "<?= tokenGoogleInicial ?>";
let usuarioLogado = <?!= usuarioInicialJson ?>;
let relatorioAtual = null;
let abaAtual = "resumo";
let opcoesCarregadas = false;

document.addEventListener("DOMContentLoaded", function() {
  prepararSelectsVazios();
  preencherMesVigente();

  const administrador = tokenGoogle &&
    usuarioLogado &&
    usuarioLogado.autorizado &&
    usuarioLogado.perfil === "administrador";

  document.getElementById("telaLogin").style.display = administrador ? "none" : "block";
  document.getElementById("conteudoRelatorios").style.display = administrador ? "block" : "none";

  if (administrador) {
    carregarRelatorio();
  }
});

function navegarParaSecao(event, id) {
  if (event) event.preventDefault();

  const destino = document.getElementById(id);
  if (!destino) return;

  destino.scrollIntoView({ behavior: "smooth", block: "start" });
}


    function prepararSelectsVazios() {
      [
        "tipoAtendimento",
        "naps",
        "opmAtual",
        "responsavel",
        "situacaoStatus",
        "sexo",
        "estadoCivil",
        "cidade",
        "bairro",
        "estado",
        "parentesco"
      ].forEach(function(id) {
        preencherSelect(id, [], "Todos");
      });
    }

 function preencherMesVigente() {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth();

  const inicio = new Date(ano, mes, 1);
  const fim = new Date(ano, mes + 1, 0);

  document.getElementById("dataInicial").value = formatarDataInput(inicio);
  document.getElementById("dataFinal").value = formatarDataInput(fim);
}

function formatarDataInput(data) {
  const ano = data.getFullYear();
  const mes = String(data.getMonth() + 1).padStart(2, "0");
  const dia = String(data.getDate()).padStart(2, "0");

  return `${ano}-${mes}-${dia}`;
}

    function coletarFiltros() {
      return {
        dataInicial: valorCampo("dataInicial"),
        dataFinal: valorCampo("dataFinal"),
        buscaLivre: valorCampo("buscaLivre"),
        tipoAtendimento: valorCampo("tipoAtendimento"),
        motivo: valorCampo("motivo"),
        naps: valorCampo("naps"),
        opmAtual: valorCampo("opmAtual"),
        cidade: valorCampo("cidade"),
        bairro: valorCampo("bairro"),
        estado: valorCampo("estado"),
        responsavel: valorCampo("responsavel"),
        situacaoStatus: valorCampo("situacaoStatus"),
        sexo: valorCampo("sexo"),
        estadoCivil: valorCampo("estadoCivil"),
        faixaEtaria: valorCampo("faixaEtaria"),
        tempoServico: valorCampo("tempoServico"),
        vinculos: valorCampo("vinculos"),
        parentesco: valorCampo("parentesco"),
        limiteDetalhes: 800
      };
    }

    function valorCampo(id) {
      return document.getElementById(id).value || "";
    }

    function carregarRelatorio() {
      const botao = document.getElementById("btnGerar");
      const mensagem = document.getElementById("mensagem");
      const painel = document.getElementById("painelResultado");

      botao.disabled = true;
      mensagem.className = "loading";
      mensagem.innerText = "Carregando relatório...";
      mensagem.style.display = "block";
      painel.style.display = "none";

      google.script.run
        .withSuccessHandler(function(relatorio) {
          relatorioAtual = relatorio;
          botao.disabled = false;
          mensagem.style.display = "none";
          painel.style.display = "block";

          if (!opcoesCarregadas && relatorio.opcoes) {
            preencherOpcoes(relatorio.opcoes);
            opcoesCarregadas = true;
          }

          atualizarStatusFiltros();
          renderizarRelatorio();
        })
        .withFailureHandler(function(erro) {
          botao.disabled = false;
          painel.style.display = "none";
          mensagem.className = "error";
          mensagem.innerText = "Erro ao carregar relatório: " + erro.message;
        })
        .gerarRelatorioGerencial(coletarFiltros(), "", "", tokenGoogle);
    }

    function preencherOpcoes(opcoes) {
      preencherSelect("tipoAtendimento", opcoes.tipoAtendimento, "Todos");
      preencherSelect("naps", opcoes.naps, "Todos");
      preencherSelect("opmAtual", opcoes.opmAtual, "Todos");
      preencherSelect("responsavel", opcoes.responsavel, "Todos");
      preencherSelect("situacaoStatus", opcoes.situacaoStatus, "Todos");
      preencherSelect("sexo", opcoes.sexo, "Todos");
      preencherSelect("estadoCivil", opcoes.estadoCivil, "Todos");
      preencherSelect("cidade", opcoes.cidade, "Todas");
      preencherSelect("bairro", opcoes.bairro, "Todos");
      preencherSelect("estado", opcoes.estado, "Todas");
      preencherSelect("parentesco", opcoes.parentesco, "Todos");
    }

    function preencherSelect(id, valores, textoPadrao) {
      const select = document.getElementById(id);
      const atual = select.value;
      let html = `<option value="">${escaparHtml(textoPadrao)}</option>`;

      (valores || []).forEach(function(valor) {
        html += `<option value="${escaparAttr(valor)}">${escaparHtml(formatarTexto(valor, id))}</option>`;
      });

      select.innerHTML = html;

      if (atual) {
        select.value = atual;
      }
    }

    function limparFiltros() {
      [
        "buscaLivre",
        "tipoAtendimento",
        "motivo",
        "naps",
        "opmAtual",
        "cidade",
        "bairro",
        "estado",
        "responsavel",
        "situacaoStatus",
        "sexo",
        "estadoCivil",
        "faixaEtaria",
        "tempoServico",
        "vinculos",
        "parentesco"
      ].forEach(function(id) {
        document.getElementById(id).value = "";
      });

      carregarRelatorio();
    }

    function atualizarStatusFiltros() {
      const filtros = coletarFiltros();
      const ativos = Object.keys(filtros).filter(function(chave) {
        return chave !== "limiteDetalhes" && filtros[chave];
      }).length;

      document.getElementById("statusFiltros").innerText =
        ativos === 0 ? "Todos os registros" : ativos + " filtro(s) aplicado(s)";
    }

    function trocarAba(aba) {
      abaAtual = aba;

      document.querySelectorAll(".tab-button").forEach(function(botao) {
        botao.classList.toggle("active", botao.dataset.tab === aba);
      });

      renderizarRelatorio();
    }

    function renderizarRelatorio() {
      if (!relatorioAtual) return;

      document.getElementById("metricas").innerHTML = montarMetricas(relatorioAtual.resumo);
      document.getElementById("conteudoAba").innerHTML = montarConteudoAba();

      const total = relatorioAtual.totalRegistros || 0;
      const exibidos = (relatorioAtual.registros || []).length;
      const limite = relatorioAtual.limiteDetalhes || exibidos;

      document.getElementById("rodapeResultado").innerText =
        total > limite
          ? `Exibindo ${exibidos} de ${total} registros filtrados.`
          : `${total} registro(s) filtrado(s).`;
    }

    function montarMetricas(resumo) {
      return [
        montarMetrica("Atendimentos", resumo.totalAtendimentos),
        montarMetrica("Pessoas", resumo.pessoasDistintas),
        montarMetrica("Grupos e Palestras", resumo.totalEventosColetivos),
        montarMetrica("Pessoas em eventos", resumo.pessoasEventos),
        montarMetrica("Total de pessoas", resumo.pessoasTotalGeral),
        montarMetrica("Faltas", resumo.totalFaltas),
        montarMetrica("Altas", resumo.totalAltas),
        montarMetrica("Arquivamentos", resumo.totalArquivamentos)
      ].join("");
    }

    function montarMetrica(rotulo, valor) {
      return `
        <article class="metric">
          <span>${escaparHtml(rotulo)}</span>
          <strong>${typeof valor === "number" ? valor.toLocaleString("pt-BR") : escaparHtml(valor || "-")}</strong>
        </article>
      `;
    }

    function montarResumoGerencialAlertas() {
      const resumo = relatorioAtual.resumo || {};
      const distribuicoes = relatorioAtual.distribuicoes || {};
      const totalAtendimentos = Number(resumo.totalAtendimentos || 0);
      const totalFaltas = Number(resumo.totalFaltas || 0);
      const totalAltas = Number(resumo.totalAltas || 0);
      const totalArquivamentos = Number(resumo.totalArquivamentos || 0);
      const totalBase = totalAtendimentos + totalFaltas;
      const taxaFaltas = totalBase > 0 ? (totalFaltas / totalBase) * 100 : 0;
      const taxaAltas = totalAtendimentos > 0 ? (totalAltas / totalAtendimentos) * 100 : 0;
      const variacao = montarLeituraVariacaoMensal(distribuicoes.porMes);
      const concentracaoNaps = montarLeituraConcentracao(distribuicoes.porNAPS, "NAPS", "naps");
      const concentracaoMotivo = montarLeituraConcentracao(distribuicoes.porMotivo, "hipótese de diagnóstico", "");
      const concentracaoTipo = montarLeituraConcentracao(distribuicoes.porTipo, "tipo de atendimento", "");

      const linhas = [
        montarLinhaAlertaGerencial(
          "Arquivamentos",
          totalArquivamentos > 0 ? "Monitorado" : "Sem registro",
          totalArquivamentos.toLocaleString("pt-BR") + " arquivamento(s) registrado(s) no periodo."
        ),
        montarLinhaAlertaGerencial(
          "Faltas",
          taxaFaltas >= 15 ? "Ponto de atenção" : "Monitorado",
          totalFaltas.toLocaleString("pt-BR") + " falta(s), " + formatarPercentualRelatorio(taxaFaltas) + " do total de registros do período."
        ),
        montarLinhaAlertaGerencial(
          "Altas",
          totalAltas > 0 ? "Monitorado" : "Sem registro",
          totalAltas.toLocaleString("pt-BR") + " alta(s), " + formatarPercentualRelatorio(taxaAltas) + " do total de atendimentos do período."
        ),
        montarLinhaAlertaGerencial(
          "Variação mensal",
          variacao.destaque,
          variacao.leitura
        ),
        montarLinhaAlertaGerencial(
          "Concentração por NAPS",
          concentracaoNaps.destaque,
          concentracaoNaps.leitura
        ),
        montarLinhaAlertaGerencial(
          "Concentração por hipótese de diagnóstico",
          concentracaoMotivo.destaque,
          concentracaoMotivo.leitura
        ),
        montarLinhaAlertaGerencial(
          "Tipo de atendimento",
          concentracaoTipo.destaque,
          concentracaoTipo.leitura
        )
      ].join("");

      return `
        <section class="table-box wide">
          <h3>Alertas gerenciais</h3>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Indicador</th>
                  <th>Sinal</th>
                  <th>Leitura</th>
                </tr>
              </thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function montarLinhaAlertaGerencial(indicador, sinal, leitura) {
      return `
        <tr>
          <td>${escaparHtml(indicador)}</td>
          <td>${escaparHtml(sinal)}</td>
          <td>${escaparHtml(leitura)}</td>
        </tr>
      `;
    }

    function montarLeituraVariacaoMensal(dadosPorMes) {
      const meses = Object.keys(dadosPorMes || {}).sort();

      if (meses.length < 2) {
        return {
          destaque: "Sem comparação",
          leitura: "Há dados de apenas um mês no período filtrado."
        };
      }

      const mesAnterior = meses[meses.length - 2];
      const mesAtual = meses[meses.length - 1];
      const valorAnterior = Number(dadosPorMes[mesAnterior] || 0);
      const valorAtual = Number(dadosPorMes[mesAtual] || 0);
      const diferenca = valorAtual - valorAnterior;

      if (valorAnterior === 0) {
        return {
          destaque: valorAtual > 0 ? "Alta sem base anterior" : "Estável",
          leitura: formatarMes(mesAtual) + " registrou " + valorAtual.toLocaleString("pt-BR") + " ocorrência(s), sem base comparável em " + formatarMes(mesAnterior) + "."
        };
      }

      const percentual = (diferenca / valorAnterior) * 100;
      const tendencia = diferenca > 0 ? "Alta" : (diferenca < 0 ? "Queda" : "Estável");

      return {
        destaque: tendencia + " de " + formatarPercentualRelatorio(Math.abs(percentual)),
        leitura: formatarMes(mesAtual) + " teve " + valorAtual.toLocaleString("pt-BR") + " ocorrência(s), contra " + valorAnterior.toLocaleString("pt-BR") + " em " + formatarMes(mesAnterior) + "."
      };
    }

    function montarLeituraConcentracao(dados, dimensao, contexto) {
      const itens = ordenarItens(dados, {});
      const total = itens.reduce(function(soma, item) {
        return soma + Number(item.total || 0);
      }, 0);

      if (itens.length === 0 || total === 0) {
        return {
          destaque: "Sem dados",
          leitura: "Não há registros suficientes para avaliar concentração por " + dimensao + "."
        };
      }

      const principal = itens[0];
      const percentual = (Number(principal.total || 0) / total) * 100;
      const nome = formatarTexto(principal.nome, contexto);
      const sinal = percentual >= 40 ? "Concentração elevada" : "Sem alerta relevante";

      return {
        destaque: sinal,
        leitura: nome + " concentra " + principal.total.toLocaleString("pt-BR") + " ocorrência(s), " + formatarPercentualRelatorio(percentual) + " do total por " + dimensao + "."
      };
    }

    function montarConteudoAba() {
      const d = relatorioAtual.distribuicoes || {};

      if (abaAtual === "outrosDados") {
        return montarOutrosDadosIndividuais();
      }

      if ((relatorioAtual.totalRegistros || 0) === 0) {
        return `<div class="empty-state">Nenhum registro encontrado para os filtros selecionados.</div>`;
      }

      if (abaAtual === "resumo") {
        return `
          <div class="tab-grid">
            ${montarResumoGerencialAlertas()}
          </div>
        `;
      }

      if (abaAtual === "atendimentos") {
        return `
          <div class="tab-grid">
            ${montarGraficoBarras("Tipo de atendimento", d.porTipo, { limite: 12 })}
            ${montarGraficoBarras("Hipóteses de diagnóstico", d.porMotivo, { limite: 15 })}
            ${montarTabelaTipoMotivo()}
          </div>
        `;
      }

      if (abaAtual === "perfil") {
  return `
    <div class="tab-grid">
      ${montarGraficoBarras("Posto/Graduação", d.porPostoGraduacao, { ordem: ordemPostoGraduacao() })}
      ${montarGraficoBarras("Situação/status", d.porSituacao, { limite: 8 })}
      ${montarGraficoBarras("Sexo", d.porSexo, { limite: 8 })}
      ${montarGraficoBarras("Faixa etária", d.porFaixaEtaria, { ordem: ordemFaixaEtaria() })}
      ${montarGraficoBarras("Estado civil", d.porEstadoCivil, { limite: 8 })}
      ${montarGraficoBarras("Tempo de serviço", d.porTempoServico, { ordem: ordemTempoServico() })}
      ${montarGraficoBarras("Responsável", d.porResponsavelNaps || d.porResponsavel, { limite: 10, classe: "wide" })}
    </div>
  `;
}

      if (abaAtual === "localidade") {
        return `
          <div class="tab-grid">
            ${montarGraficoBarras("OPM", d.porOPM, { limite: 15, contexto: "opmAtual" })}
            ${montarGraficoBarras("Cidade", d.porCidade, { limite: 15 })}
            ${montarGraficoBarras("Bairro", d.porBairro, { limite: 15 })}
          ${montarGraficoBarras("NAPS", d.porNAPS, { limite: 10 })}
          </div>
        `;
      }

     if (abaAtual === "vinculos") {
  return `
    <div class="tab-grid">
      ${montarGraficoBarras("Parentesco/vínculo", d.porParentesco, { limite: 12 })}
      ${montarTabelaVinculos()}
    </div>
  `;
}

      return montarTabelaDetalhada();
    }

    function montarOutrosDadosIndividuais() {
      const dados = relatorioAtual.dadosIndividuais || {};

      if (dados.status === "sem_busca" || !dados.status) {
        return `
          <section class="table-box wide">
            <h3>Outros Dados</h3>
            <div class="empty-state">Use a Busca Individual para visualizar nome, R.E., CPF, unidade, NAPS, atendimentos, faltas, altas e distância aproximada do NAPS que foi atendido.</div>
          </section>
        `;
      }

      if (dados.status === "sem_resultado") {
        return `
          <section class="table-box wide">
            <h3>Outros Dados</h3>
            <div class="empty-state">${escaparHtml(dados.mensagem || "Nenhum cadastro localizado.")}</div>
          </section>
        `;
      }

      if (dados.status === "multiplos") {
        return montarCandidatosBuscaIndividual(dados);
      }

      const distancia = dados.distanciaDisponivel
        ? dados.distanciaTexto
        : (dados.distanciaTexto || "não disponível");

      return `
        <section class="table-box wide">
          <h3>Outros Dados</h3>
          ${montarRelatorioIndividualOutrosDados(dados, distancia)}
          ${dados.mensagemDistancia ? `<div class="empty-state" style="margin-top:12px;">${escaparHtml(dados.mensagemDistancia)}</div>` : ""}
          ${montarObservacoesIndividuais(dados)}
        </section>
      `;
    }

    function montarRelatorioIndividualOutrosDados(dados, distancia) {
      const nome = destacarRelatorio(formatarTexto(dados.nome));
      const re = destacarRelatorio(dados.re || "-");
      const cpf = destacarRelatorio(dados.cpf || "-");
      const unidade = destacarRelatorio(formatarTexto(dados.unidade, "opmAtual"));
      const naps = destacarRelatorio(formatarTexto(dados.naps, "naps"));
      const atendimentos = destacarQuantidadeRelatorio(dados.totalAtendimentos, "atendimento", "atendimentos");
      const faltas = destacarQuantidadeRelatorio(dados.totalFaltas, "falta", "faltas");
      const altas = destacarQuantidadeRelatorio(dados.totalAltas, "alta", "altas");
      const arquivamentos = destacarQuantidadeRelatorio(dados.totalArquivamentos, "arquivamento", "arquivamentos");
      const distanciaTexto = dados.distanciaDisponivel ? distancia : (distancia || "não disponível");
      const distanciaDestacada = destacarRelatorio(distanciaTexto);
      const motivoReferencia = destacarRelatorio(formatarTexto(dados.motivoReferencia));
      const responsavelReferencia = destacarRelatorio(formatarTexto(dados.responsavelReferencia));
      const ultimoAtendimento = dados.dataReferencia
        ? `<p>O último atendimento considerado no filtro foi em ${destacarRelatorio(dados.dataReferencia)}, com hipótese de diagnóstico ${motivoReferencia}, e responsável ${responsavelReferencia}.</p>`
        : "";
      const textoDistancia = dados.distanciaDisponivel
        ? `Sua residência fica aproximadamente ${distanciaDestacada} do NAPS ${naps}.`
        : `A distância da residência até o NAPS ${naps} está ${distanciaDestacada}.`;

      return `
        <div class="individual-report">
          <p>O paciente ${nome}, identificado com R.E. ${re} e CPF ${cpf}, pertencente à unidade ${unidade}, teve ${atendimentos} no período selecionado.</p>
          <p>Teve ${faltas}, obteve ${altas} e registrou ${arquivamentos}.</p>
          <p>${textoDistancia}</p>
          ${ultimoAtendimento}
        </div>
      `;
    }

    function montarObservacoesIndividuais(dados) {
      const observacoes = dados.observacoesHistorico || [];

      if (observacoes.length === 0) return "";

      const itens = observacoes.map(function(item) {
        const meta = [
          item.dataAtendimento ? "Data: " + item.dataAtendimento : "",
          item.responsavel ? "Responsável: " + formatarTexto(item.responsavel) : "",
          item.tipoAtendimento ? "Tipo: " + formatarTexto(item.tipoAtendimento) : "",
          item.motivo ? "Hipótese de diagnóstico: " + formatarTexto(item.motivo) : ""
        ].filter(Boolean).join(" | ");

        const observacaoAtendimento = String(item.observacoes || "").trim()
          ? `<p class="individual-observacao-texto"><strong>Observação do atendimento:</strong> ${escaparHtml(item.observacoes)}</p>`
          : "";
        const observacoesVinculos = montarObservacoesVinculosIndividuais(item.observacoesVinculos || []);

        return `
          <article class="individual-observacao-item">
            <div class="individual-observacao-meta">${escaparHtml(meta || "Observação registrada")}</div>
            ${observacaoAtendimento}
            ${observacoesVinculos}
          </article>
        `;
      }).join("");

      return `<div class="individual-observacoes">${itens}</div>`;
    }

    function montarObservacoesVinculosIndividuais(vinculos) {
      const itens = vinculos
        .filter(function(vinculo) {
          return String(vinculo.observacoes || "").trim() !== "";
        })
        .map(function(vinculo) {
          const identificacao = [
            vinculo.nome ? formatarTexto(vinculo.nome) : "",
            vinculo.parentesco ? formatarTexto(vinculo.parentesco) : ""
          ].filter(Boolean).join(" - ");

          const rotulo = identificacao
            ? "Observação da pessoa vinculada (" + identificacao + "):"
            : "Observação da pessoa vinculada:";

          return `<p class="individual-observacao-texto"><strong>${escaparHtml(rotulo)}</strong> ${escaparHtml(vinculo.observacoes)}</p>`;
        });

      return itens.join("");
    }

    function destacarQuantidadeRelatorio(valor, singular, plural) {
      const numero = Number(valor || 0);
      const texto = numero.toLocaleString("pt-BR") + " " + (numero === 1 ? singular : plural);

      return destacarRelatorio(texto);
    }

    function destacarRelatorio(valor) {
      const texto = valor === 0 || valor ? String(valor) : "-";

      return `<strong>${escaparHtml(texto)}</strong>`;
    }

    function montarCardIndividual(rotulo, valor) {
      const texto = valor === 0 || valor ? String(valor) : "-";

      return `
        <article class="individual-card">
          <span>${escaparHtml(rotulo)}</span>
          <strong>${escaparHtml(texto)}</strong>

            <h3>${escaparHtml(titulo)}</h3>
            <div class="empty-state">Sem dados para exibir.</div>
          </section>

      }

      const maximo = Math.max.apply(null, itens.map(function(item) { return item.total; }));
      let linhas = "";

      itens.forEach(function(item) {
        const largura = maximo > 0 ? Math.max((item.total / maximo) * 100, 2) : 0;
        const label = config.tipo === "mes" ? formatarMes(item.nome) : formatarTexto(item.nome, config.contexto);

        linhas += `
          <div class="bar-row">
            <div class="bar-label" title="${escaparAttr(label)}">${escaparHtml(label)}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${largura}%;"></div>
            </div>
            <div class="bar-total">${Number(item.total).toLocaleString("pt-BR")}</div>
          </div>
        `;
      });

      return `
        <section class="chart-box ${config.classe || ""}">

    function montarTabelaTipoMotivo() {
      const registros = (relatorioAtual.registros || []).filter(function(registro) {
        return !ehFaltaRelatorio(registro);
      });
      const grupos = {};

      registros.forEach(function(registro) {
        const tipoChave = normalizarTexto(registro.tipoAtendimento || "nao informado") || "nao informado";
        const motivoChave = normalizarTexto(registro.motivo || "nao informado") || "nao informado";

        if (!grupos[tipoChave]) {
          grupos[tipoChave] = {
            tipo: registro.tipoAtendimento || "nao informado",
            total: 0,
            motivos: {}
          };
        }

        grupos[tipoChave].total++;

        if (!grupos[tipoChave].motivos[motivoChave]) {
          grupos[tipoChave].motivos[motivoChave] = {
            motivo: registro.motivo || "nao informado",
            total: 0
          };
        }

        grupos[tipoChave].motivos[motivoChave].total++;
      });

      const itens = Object.keys(grupos).map(function(chave) {
        const grupo = grupos[chave];
        const motivoPrincipal = Object.keys(grupo.motivos)
          .map(function(motivoChave) {
            return grupo.motivos[motivoChave];
          })
          .sort(function(a, b) {
            return b.total - a.total || normalizarTexto(a.motivo).localeCompare(normalizarTexto(b.motivo));
          })[0] || { motivo: "nao informado", total: 0 };

        return {
          tipo: grupo.tipo,
          motivo: motivoPrincipal.motivo,
          quantidade: motivoPrincipal.total,
          totalTipo: grupo.total,
          percentual: grupo.total > 0 ? (motivoPrincipal.total / grupo.total) * 100 : 0
        };
      }).sort(function(a, b) {
        return b.totalTipo - a.totalTipo || normalizarTexto(a.tipo).localeCompare(normalizarTexto(b.tipo));
      }).slice(0, 30);

      if (itens.length === 0) {
        return `
          <section class="table-box wide">
            <h3>Hipótese de diagnóstico mais frequente por tipo de atendimento</h3>
            <div class="empty-state">Sem dados para exibir.</div>
          </section>
        `;
      }

      const linhas = itens.map(function(item) {
        return `
          <tr>
            <td>${escaparHtml(formatarTexto(item.tipo))}</td>
            <td>${escaparHtml(formatarTexto(item.motivo))}</td>
            <td>${Number(item.quantidade).toLocaleString("pt-BR")}</td>
            <td>${Number(item.totalTipo).toLocaleString("pt-BR")}</td>
            <td>${formatarPercentualRelatorio(item.percentual)}</td>
          </tr>
        `;
      }).join("");

      return `
        <section class="table-box wide">
          <h3>Hipótese de diagnóstico mais frequente por tipo de atendimento</h3>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Tipo de atendimento</th>
                  <th>Hipótese de diagnóstico mais frequente</th>
                  <th>Quantidade</th>
                  <th>Total do tipo</th>
                  <th>% no tipo</th>
                </tr>
              </thead>
              <tbody>${linhas}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function ordenarItens(dados, config) {
      config = config || {};
      let itens = Object.keys(dados || {}).map(function(nome) {
        return {
          nome: nome,
          total: dados[nome]
        };
      });

      if (config.ordem) {
        const ordem = config.ordem;
        itens.sort(function(a, b) {
          return ordem.indexOf(a.nome) - ordem.indexOf(b.nome);
        });
      } else if (config.tipo === "mes") {
        itens.sort(function(a, b) {
          return String(a.nome).localeCompare(String(b.nome));
        });
      } else {
        itens.sort(function(a, b) {
          return b.total - a.total || String(a.nome).localeCompare(String(b.nome));
        });
      }

      if (config.limite) {
        itens = itens.slice(0, config.limite);
      }

      return itens;
    }

    function exportarCSV() {
      if (!relatorioAtual || !relatorioAtual.registros || relatorioAtual.registros.length === 0) {
        return;
      }

      const cabecalho = [
        "Data",
        "Nome",
        "R.E.",
        "CPF",
        "Tipo",
        "Hipótese de diagnóstico",
        "NAPS",
        "OPM",
        "Status",
        "Responsável",
        "Cidade",
        "UF",
        "CEP",
        "Endereço",
        "Vínculos"
      ];

      const linhas = relatorioAtual.registros.map(function(registro) {
        return [
          registro.dataCadastro,
          formatarTexto(registro.nome),
          registro.re,
          registro.cpf,
          formatarTexto(registro.tipoAtendimento),
          formatarTexto(registro.motivo),
          formatarTexto(registro.naps, "naps"),
          formatarTexto(registro.opmAtual, "opmAtual"),
          formatarTexto(registro.situacaoStatus),
          formatarTexto(registro.responsavel),
          formatarTexto(registro.cidade),
          formatarTexto(registro.estado, "estado"),
          registro.cep,
          formatarTexto(registro.endereco),
          registro.quantidadeVinculos
        ];
      });

      const csv = [cabecalho].concat(linhas).map(function(linha) {
        return linha.map(formatarCampoCSV).join(";");
      }).join("\n");

      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "relatorio_saic_" + new Date().toISOString().slice(0, 10) + ".csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

      return `"${String(valor || "").replace(/"/g, '""')}"`;

        [/\bCopom\b/g, "Copom"],
        [/\bPm\b/g, "PM"],
        [/\bCpam\b/g, "CPAM"],
        [/\bCaps\b/g, "CAPS"],
        [/\bNaps\b/g, "NAPS"],
        [/\bNAPS\/[A-Z0-9-]+/gi, function(valor) { return valor.toUpperCase(); }]
      ];

      return substituicoes.reduce(function(resultado, item) {
        return resultado.replace(item[0], item[1]);
      }, texto);
    }

    function normalizarTexto(valor) {
      return String(valor || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function mascararBuscaIndividual(campo) {
      let valor = String(campo.value || "").toUpperCase();
      const limpo = valor.replace(/[^0-9A-Z]/g, "");
      const apenasNumeros = valor.replace(/\D/g, "");

      if (/[B-Z]/.test(valor.replace(/^\d{6}A$/, ""))) {
        campo.value = valor;
        return;
      }

      if (/^\d{6}A$/.test(limpo)) {
        campo.value = limpo.substring(0, 6) + "-A";
        return;
      }

      if (/^\d{7}$/.test(limpo)) {
        campo.value = limpo.substring(0, 6) + "-" + limpo.substring(6);
        return;
      }

      if (apenasNumeros.length >= 8 && apenasNumeros.length <= 11 && apenasNumeros === limpo) {
        campo.value = apenasNumeros
          .substring(0, 11)
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        return;
      }

      campo.value = valor;
    }

    function escaparHtml(valor) {
      return String(valor === null || valor === undefined ? "" : valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escaparAttr(valor) {
      return escaparHtml(valor);
    }
  </script>
</body>
